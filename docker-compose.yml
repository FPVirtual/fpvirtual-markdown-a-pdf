services:
  app:
    build: .
    container_name: fpvirtual-markdown2pdf-8086
    ports:
      - "${PORT:-3000}:3000"
    environment:
      # Nuxt sobreescribe el runtimeConfig con las variables NUXT_* al arrancar
      NUXT_PANDOC_IMAGE: ${PANDOC_IMAGE:-fpvirtual-pandoc:latest}
      NUXT_MAX_UPLOAD_MB: ${NUXT_MAX_UPLOAD_MB:-50}
      # El workspace debe usar la MISMA ruta absoluta en el contenedor y en el
      # host, porque el contenedor efímero de pandoc monta esa ruta vía socket
      # y el daemon la resuelve en el host.
      NUXT_WORKSPACE_ROOT: ${WORKSPACE_DIR:-${PWD}/data}/uploads
      # La plantilla se monta en la MISMA ruta absoluta en host y contenedor,
      # igual que el workspace: el contenedor efímero de pandoc la monta vía
      # socket y el daemon la resuelve en el host.
      NUXT_THEME_DIR: ${THEME_DIR:-${PWD}/fpvirtual-theme}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${WORKSPACE_DIR:-${PWD}/data}:${WORKSPACE_DIR:-${PWD}/data}
      - ${THEME_DIR:-${PWD}/fpvirtual-theme}:${THEME_DIR:-${PWD}/fpvirtual-theme}:ro
    restart: unless-stopped
